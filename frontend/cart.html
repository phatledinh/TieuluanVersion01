<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart | AI E-Commerce</title>
  </head>
  <body>
    <header>
      <div class="container nav-container">
        <a href="/" class="logo">AI-Store.</a>
        <nav class="nav-links">
          <a href="/">Catalog</a>
          <a href="/cart.html" class="active">Cart <span id="cart-count"></span></a>
          <a href="/login.html" id="auth-link">Login</a>
        </nav>
      </div>
    </header>

    <main class="container" style="padding-top: 3rem; padding-bottom: 5rem;">
      <h1 class="animate-fade-in">Your Shopping Cart</h1>
      
      <div class="cart-layout animate-fade-in" style="animation-delay: 0.1s;">
        <div class="cart-items glass glass-panel">
          <div id="cart-content">
            <!-- Cart items injected via JS -->
            <div class="loading-spinner" style="margin: 2rem auto;"></div>
          </div>
        </div>

        <div class="cart-summary glass glass-panel">
          <h3>Order Summary</h3>
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="cart-subtotal">$0.00</span>
          </div>
          <div class="summary-row">
            <span>Tax (10%)</span>
            <span id="cart-tax">$0.00</span>
          </div>
          <hr style="border-color: var(--surface-border); margin: 1rem 0;">
          <div class="summary-row" style="font-weight: 700; font-size: 1.25rem; color: var(--primary-color);">
            <span>Total</span>
            <span id="cart-total">$0.00</span>
          </div>
          <a href="/checkout.html" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem; text-decoration: none; text-align: center;">Proceed to Checkout</a>
        </div>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
    <script type="module">
      import { fetchCart, renderCartItems } from '/src/main.js';
      
      document.addEventListener('DOMContentLoaded', () => {
        if (!localStorage.getItem('jwt_token')) {
          document.getElementById('cart-content').innerHTML = `
            <div style="text-align: center; padding: 2rem;">
              <p>Please login to view your cart.</p>
              <a href="/login.html" class="btn btn-outline" style="margin-top: 1rem;">Login</a>
            </div>
          `;
          return;
        }
        fetchCart();
      });
    </script>
  </body>
</html>
