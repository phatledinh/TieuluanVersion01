<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giỏ Hàng | AI E-Commerce</title>
  </head>
  <body>
    <header>
      <div class="container nav-container">
        <a href="/" class="logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="color: var(--primary-color); vertical-align: middle; margin-right: 4px; margin-bottom: 4px;"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
          ShopAI
        </a>
        <nav class="nav-links">
          <a href="/" id="nav-home">Trang chủ</a>
          <a href="/" id="nav-catalog">Danh mục <span style="font-size: 0.8rem;">▼</span></a>
        </nav>
        <div class="nav-user">
          <a href="/cart.html" style="text-decoration: none; color: inherit;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            <span style="font-size: 0.85rem; margin-left: 4px;">Đơn hàng</span>
            <span id="cart-count" style="background: var(--primary-color); color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.7rem; position: relative; top: -10px; right: 5px;">0</span>
          </a>
          <span style="margin: 0 10px; font-size: 0.85rem;" id="nav-username">user_1</span>
          <a href="/login.html" id="auth-link" style="color: var(--danger); font-size: 0.85rem; text-decoration: none;">Đăng xuất</a>
        </div>
      </div>
    </header>

    <main class="container" style="padding-top: 3rem; padding-bottom: 5rem;">
      <h1 class="animate-fade-in">Giỏ Hàng</h1>
      
      <div class="cart-layout animate-fade-in" style="animation-delay: 0.1s;">
        <div class="cart-items glass glass-panel">
          <div id="cart-content">
            <!-- Cart items injected via JS -->
            <div class="loading-spinner" style="margin: 2rem auto;"></div>
          </div>
        </div>

        <div class="cart-summary glass glass-panel">
          <h3>Tóm Tắt Đơn Hàng</h3>
          <div class="summary-row">
            <span>Tạm tính</span>
            <span id="cart-subtotal">0 ₫</span>
          </div>
          <div class="summary-row">
            <span>Thuế (10%)</span>
            <span id="cart-tax">0 ₫</span>
          </div>
          <hr style="border-color: var(--surface-border); margin: 1rem 0;">
          <div class="summary-row" style="font-weight: 700; font-size: 1.25rem; color: var(--primary-color);">
            <span>Tổng cộng</span>
            <span id="cart-total">0 ₫</span>
          </div>
          <a href="/checkout.html" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem; text-decoration: none; text-align: center;">Thanh Toán</a>
        </div>
      </div>

      <!-- AI Recommendations in Cart (PDF 3.8.1: Khi add-to-cart) -->
      <section id="cart-recommendations" class="recommendations-section animate-fade-in" style="display: none; animation-delay: 0.3s;">
        <div class="glass glass-panel">
          <div class="section-header">
            <span class="ai-badge">🛒 Sản phẩm liên quan</span>
            <h3>Có Thể Bạn Cũng Thích</h3>
            <p class="section-desc">Gợi ý dựa trên hành vi mua sắm — Hybrid AI Model (LSTM + Graph + RAG)</p>
          </div>
          <div id="cart-rec-grid" class="product-grid rec-grid"></div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
    <script type="module">
      import { fetchCart } from '/src/main.js';
      
      document.addEventListener('DOMContentLoaded', () => {
        if (!localStorage.getItem('jwt_token')) {
          document.getElementById('cart-content').innerHTML = `
            <div style="text-align: center; padding: 2rem;">
              <p>Vui lòng đăng nhập để xem giỏ hàng.</p>
              <a href="/login.html" class="btn btn-outline" style="margin-top: 1rem;">Đăng nhập</a>
            </div>
          `;
          return;
        }
        fetchCart();
      });
    </script>
  </body>
</html>
