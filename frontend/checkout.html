<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | AI E-Commerce</title>
  </head>
  <body>
    <header>
      <div class="container nav-container">
        <a href="/" class="logo">AI-Store.</a>
        <nav class="nav-links">
          <a href="/">Catalog</a>
          <a href="/cart.html">Cart <span id="cart-count"></span></a>
          <a href="/login.html" id="auth-link">Login</a>
        </nav>
      </div>
    </header>

    <main class="container" style="padding-top: 3rem; padding-bottom: 5rem; max-width: 800px;">
      <h1 class="animate-fade-in" style="text-align: center;">Secure Checkout</h1>
      
      <div class="glass glass-panel animate-fade-in" style="animation-delay: 0.1s; margin-top: 2rem;">
        
        <!-- Step 1: Shipping (Order Creation) -->
        <div id="step-shipping">
          <h2 style="border-bottom: 1px solid var(--surface-border); padding-bottom: 1rem; margin-bottom: 1.5rem;">1. Shipping Details</h2>
          <form id="shipping-form">
            <div class="form-group">
              <label for="fullName">Full Name</label>
              <input type="text" id="fullName" class="input-control" required placeholder="John Doe">
            </div>
            <div class="form-group">
              <label for="address">Shipping Address</label>
              <input type="text" id="address" class="input-control" required placeholder="123 Main St, City, Country">
            </div>
            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" class="input-control" required placeholder="+1 234 567 8900">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="continue-btn">Continue to Payment</button>
          </form>
        </div>

        <!-- Step 2: Payment (Mock) -->
        <div id="step-payment" style="display: none;">
          <h2 style="border-bottom: 1px solid var(--surface-border); padding-bottom: 1rem; margin-bottom: 1.5rem;">2. Payment Method</h2>
          
          <div class="mock-card">
            <div class="card-chip"></div>
            <div style="margin-top: 2rem; font-size: 1.25rem; letter-spacing: 2px;">**** **** **** 4242</div>
            <div style="display: flex; justify-content: space-between; margin-top: 1.5rem; color: rgba(255,255,255,0.7); font-size: 0.875rem;">
              <span>CARD HOLDER</span>
              <span>EXPIRES</span>
            </div>
            <div style="display: flex; justify-content: space-between;">
              <span id="display-name">JOHN DOE</span>
              <span>12/25</span>
            </div>
          </div>

          <form id="payment-form" style="margin-top: 2rem;">
            <div class="form-group">
              <label for="cardNumber">Card Number (Mock)</label>
              <input type="text" id="cardNumber" class="input-control" value="4242 4242 4242 4242" disabled>
            </div>
            <div id="payment-error" style="color: var(--danger); margin-bottom: 1rem; display: none;"></div>
            <button type="submit" class="btn btn-primary" style="width: 100%; background: linear-gradient(135deg, var(--success), #059669); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);" id="pay-btn">
              Pay Now & Complete Order
            </button>
          </form>
        </div>

        <!-- Step 3: Success -->
        <div id="step-success" style="display: none; text-align: center; padding: 2rem 0;">
          <div style="width: 80px; height: 80px; background: rgba(16, 185, 129, 0.2); color: var(--success); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
          <h2 style="color: var(--success);">Payment Successful!</h2>
          <p style="margin-bottom: 2rem;">Your order <strong id="success-order-id"></strong> has been placed and is being processed.</p>
          <a href="/" class="btn btn-primary">Return to Catalog</a>
        </div>

      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
    <script type="module">
      import { handleCheckout } from '/src/main.js';
      
      document.addEventListener('DOMContentLoaded', () => {
        if (!localStorage.getItem('jwt_token')) {
          window.location.href = '/login.html';
          return;
        }
        handleCheckout();
      });
    </script>
  </body>
</html>
